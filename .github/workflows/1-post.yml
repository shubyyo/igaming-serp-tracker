name: Post first fetches
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Queue today's first fetches
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_BASE: ${{ vars.DATAFORSEO_BASE }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TRACKER_PROVIDER: ${{ vars.TRACKER_PROVIDER }}
        run: python -m tracker post
      - name: Commit data
        run: |
          git config user.name "serp-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "data: post $(date -u +%F)"
          git push
